<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found · Abhay Prasad</title>
  <meta name="robots" content="noindex">
  <style>
    :root { color-scheme: dark; --bg: #03060f; --text: #e8f4ff; --muted: #7893bb; --stroke: rgba(130,185,255,.18); }
    @media (prefers-color-scheme: light) { :root { color-scheme: light; --bg: #eef5fd; --text: #06142e; --muted: #566f94; --stroke: rgba(6,20,46,.12); } }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
      font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--text);
      background:
        radial-gradient(60vmax 60vmax at 0% 0%, rgba(30,143,255,.35), transparent 60%),
        radial-gradient(50vmax 50vmax at 100% 100%, rgba(6,52,94,.5), transparent 60%),
        var(--bg);
    }
    main {
      max-width: 440px; width: 100%; padding: 36px; border-radius: 28px; text-align: center;
      background: rgba(255,255,255,.06); border: 1px solid var(--stroke);
      -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
    }
    h1 { margin: 0 0 6px; font-size: 64px; line-height: 1; letter-spacing: -.04em; }
    p { margin: 0 0 24px; color: var(--muted); }
    a {
      display: inline-flex; align-items: center; height: 46px; padding: 0 22px; border-radius: 999px;
      color: #fff; font-weight: 600; text-decoration: none;
      background: linear-gradient(160deg, #3fb4ff, #0a5fd0 60%, #062a6b); box-shadow: 0 10px 30px -10px rgba(46,166,255,.8);
    }
  </style>
</head>
<body>
  <main>
    <h1>404</h1>
    <p>This page doesn't exist. It may have moved, or the link has a typo.</p>
    <a href="/">Back to the portfolio</a>
  </main>
</body>
</html>
