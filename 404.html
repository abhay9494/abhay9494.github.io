<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found · Abhay Prasad</title>
  <meta name="robots" content="noindex">
  <style>
    :root { color-scheme: dark; --bg: #07070c; --text: #eef0f7; --muted: #8a90a3; --stroke: rgba(255,255,255,.12); }
    @media (prefers-color-scheme: light) { :root { color-scheme: light; --bg: #eef0f7; --text: #0c0e16; --muted: #5f667b; --stroke: rgba(20,24,48,.12); } }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
      font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--text);
      background:
        radial-gradient(60vmax 60vmax at 0% 0%, rgba(84,64,255,.35), transparent 60%),
        radial-gradient(50vmax 50vmax at 100% 100%, rgba(0,166,214,.3), transparent 60%),
        var(--bg);
    }
    main {
      max-width: 440px; width: 100%; padding: 36px; border-radius: 28px; text-align: center;
      background: rgba(255,255,255,.06); border: 1px solid var(--stroke);
      -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
    }
    h1 { margin: 0 0 6px; font-size: 64px; line-height: 1; letter-spacing: -.04em; }
    p { margin: 0 0 24px; color: var(--muted); }
    a {
      display: inline-flex; align-items: center; height: 46px; padding: 0 22px; border-radius: 999px;
      color: #fff; font-weight: 600; text-decoration: none;
      background: linear-gradient(135deg, #7c6cf0, #5b8cff 55%, #2fc3e6);
    }
  </style>
</head>

  <main>

</html>
